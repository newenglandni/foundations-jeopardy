<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Family Foundations</title><link rel="stylesheet" href="family-foundations.css">
</head>
<body>
<main class="app">
  <header><div><p class="eyebrow">Foundations textbook review</p><h1>Family Foundations</h1><p>Family Feud-style learning game</p></div><div class="header-actions"><button id="music">Music: Off</button><button id="reset">New Game</button></div></header>
  <section id="setup" class="card">
    <h2>Set up your game</h2>
    <label>Game mode <select id="mode"><option value="solo">One player vs. Computer</option><option value="teams">Two student teams</option></select></label>
    <label>Student / Team 1 name <input id="team1" value="Student 1"></label>
    <label id="team2-wrap">Team 2 name <input id="team2" value="Student 2"></label>
    <button id="start" class="primary">Start Game</button>
  </section>
  <section id="game" class="hidden">
    <div class="scorebar"><div><span id="team1-label"></span><strong id="score1">0</strong></div><div class="round" id="round-label"></div><div><span id="team2-label"></span><strong id="score2">0</strong></div></div>
    <div class="card">
      <p class="eyebrow" id="part"></p><h2 id="question"></h2><button id="read-question">Read Question Aloud</button><p id="turn"></p>
      <div id="answers" class="answers"></div>
      <div class="controls"><input id="guess" placeholder="Type an answer"><button id="submit" class="primary">Submit Answer</button><button id="strike" class="danger">Strike</button></div>
      <p id="strikes"></p><button id="next" class="primary hidden">Next Round</button>
    </div>
  </section>
</main><script src="family-foundations.js"></script>
</body></html>
